    <!-- Critical CSS for CTA buttons - must load before React to prevent FOUC -->
    <style>
      /* Critical CSS for CTA buttons - loads immediately on first page load */
      /* Target by data attributes first (set immediately), then by classes */
      [data-hero-button="slide1"],
      [data-hero-button="slide1-mobile"],
      [data-hero-button="slide1"].MuiButton-root,
      [data-hero-button="slide1-mobile"].MuiButton-root,
      button.hero-slide-1-button.MuiButton-root,
      button.hero-slide-1-button.active.MuiButton-root,
      a.hero-slide-1-button.MuiButton-root,
      a.hero-slide-1-button.active.MuiButton-root,
      button.hero-slide-1-button,
      button.hero-slide-1-button.active,
      a.hero-slide-1-button,
      a.hero-slide-1-button.active {
        background-color: white !important;
        color: #FFC107 !important;
        display: inline-flex !important;
        align-items: center !important;
        justify-content: center !important;
        cursor: pointer !important;
        border-radius: 10px !important;
        font-weight: 700 !important;
        position: relative !important;
        overflow: hidden !important;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15), 0 2px 8px rgba(0, 0, 0, 0.1) !important;
      }
      
      /* Responsive margin-top and padding for slide 1 button */
      @media (max-width: 599px) {
        [data-hero-button="slide1"],
        [data-hero-button="slide1-mobile"],
        [data-hero-button="slide1"].MuiButton-root,
        [data-hero-button="slide1-mobile"].MuiButton-root,
        button.hero-slide-1-button,
        a.hero-slide-1-button {
          margin-top: 1rem !important;
          padding: 0.75rem 1.5rem !important;
          font-size: 0.8rem !important;
        }
      }
      @media (min-width: 600px) and (max-width: 959px) {
        [data-hero-button="slide1"],
        [data-hero-button="slide1"].MuiButton-root,
        button.hero-slide-1-button,
        a.hero-slide-1-button {
          margin-top: 1.25rem !important;
        }
      }
      @media (min-width: 960px) {
        [data-hero-button="slide1"],
        [data-hero-button="slide1"].MuiButton-root,
        button.hero-slide-1-button,
        a.hero-slide-1-button {
          margin-top: 1.5rem !important;
        }
      }
      
      [data-hero-button="slide2"],
      [data-hero-button="slide3"],
      [data-hero-button="slide4"],
      [data-hero-button="slide2"].MuiButton-root,
      [data-hero-button="slide3"].MuiButton-root,
      [data-hero-button="slide4"].MuiButton-root,
      button.hero-slide-button-1.MuiButton-root,
      button.hero-slide-button-2.MuiButton-root,
      button.hero-slide-button-3.MuiButton-root,
      button.hero-slide-button-1.active.MuiButton-root,
      button.hero-slide-button-2.active.MuiButton-root,
      button.hero-slide-button-3.active.MuiButton-root,
      a.hero-slide-button-1.MuiButton-root,
      a.hero-slide-button-2.MuiButton-root,
      a.hero-slide-button-3.MuiButton-root,
      a.hero-slide-button-1.active.MuiButton-root,
      a.hero-slide-button-2.active.MuiButton-root,
      a.hero-slide-button-3.active.MuiButton-root,
      button.hero-slide-button-1,
      button.hero-slide-button-2,
      button.hero-slide-button-3,
      button.hero-slide-button-1.active,
      button.hero-slide-button-2.active,
      button.hero-slide-button-3.active,
      a.hero-slide-button-1,
      a.hero-slide-button-2,
      a.hero-slide-button-3,
      a.hero-slide-button-1.active,
      a.hero-slide-button-2.active,
      a.hero-slide-button-3.active {
        background-color: #4FA953 !important;
        color: white !important;
        display: inline-flex !important;
        align-items: center !important;
        justify-content: center !important;
        cursor: pointer !important;
        font-weight: 700 !important;
        position: relative !important;
        overflow: hidden !important;
        box-shadow: 0 10px 30px rgba(79, 169, 83, 0.35), 0 5px 15px rgba(79, 169, 83, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.1) !important;
      }
      
      /* Critical CSS for navbar donate button - defaults to mobile for smallest screens */
      [data-navbar-button="donate"],
      [data-navbar-button="donate"].MuiButton-root,
      button[data-navbar-button="donate"],
      a[data-navbar-button="donate"] {
        background-color: #4FA953 !important;
        color: white !important;
        display: inline-flex !important;
        align-items: center !important;
        justify-content: center !important;
        cursor: pointer !important;
        font-weight: 700 !important;
        position: relative !important;
        overflow: hidden !important;
        border-radius: 10px !important;
        font-size: 0.8rem !important;
        padding: 6px 14px !important;
        box-shadow: 0 6px 20px rgba(79, 169, 83, 0.35), 0 3px 10px rgba(79, 169, 83, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.1) !important;
      }
      
      /* Responsive styles for donate button */
      @media (max-width: 599px) {
        [data-navbar-button="donate"],
        [data-navbar-button="donate"].MuiButton-root,
        button[data-navbar-button="donate"],
        a[data-navbar-button="donate"] {
          padding: 6px 14px !important;
          font-size: 0.8rem !important;
          border-radius: 10px !important;
        }
      }
      @media (min-width: 600px) and (max-width: 959px) {
        [data-navbar-button="donate"],
        [data-navbar-button="donate"].MuiButton-root,
        button[data-navbar-button="donate"],
        a[data-navbar-button="donate"] {
          padding: 8px 20px !important;
          font-size: 0.85rem !important;
          border-radius: 12px !important;
        }
      }
      @media (min-width: 960px) {
        [data-navbar-button="donate"],
        [data-navbar-button="donate"].MuiButton-root,
        button[data-navbar-button="donate"],
        a[data-navbar-button="donate"] {
          padding: 10px 24px !important;
          font-size: 0.95rem !important;
          border-radius: 14px !important;
        }
      }
      
      /* Critical CSS for language selector toggle button */
      .btn-container,
      .btn-container.MKBox-root,
      div.btn-container,
      div.btn-container.MKBox-root,
      [class*="btn-container"],
      [class*="btn-container"].MKBox-root,
      [data-language-selector="true"],
      [data-language-selector="true"].MKBox-root,
      div[data-language-selector="true"],
      div[data-language-selector="true"].MKBox-root {
        display: flex !important;
        align-items: center !important;
        gap: 0.5rem !important;
        padding: 4px 8px !important;
        transition: all 0.3s ease !important;
        margin-left: -16px !important;
      }
      
      @media (min-width: 600px) {
        .btn-container,
        .btn-container.MKBox-root,
        div.btn-container,
        div.btn-container.MKBox-root,
        [class*="btn-container"],
        [class*="btn-container"].MKBox-root,
        [data-language-selector="true"],
        [data-language-selector="true"].MKBox-root,
        div[data-language-selector="true"],
        div[data-language-selector="true"].MKBox-root {
          gap: 0.75rem !important;
          padding: 4px 10px !important;
        }
      }
      
      @media (min-width: 960px) {
        .btn-container,
        .btn-container.MKBox-root,
        div.btn-container,
        div.btn-container.MKBox-root,
        [class*="btn-container"],
        [class*="btn-container"].MKBox-root,
        [data-language-selector="true"],
        [data-language-selector="true"].MKBox-root,
        div[data-language-selector="true"],
        div[data-language-selector="true"].MKBox-root {
          gap: 1rem !important;
          padding: 6px 12px !important;
        }
      }
    </style>
    <!-- Script to apply styles immediately when buttons are created (before React hydration) -->
    <script>
      (function() {
        'use strict';
        // Function to apply critical styles to buttons
        function applyButtonStyles() {
          // Find buttons by data attribute or class
          const slide1Buttons = document.querySelectorAll('[data-hero-button="slide1"], [data-hero-button="slide1-mobile"], .hero-slide-1-button');
          const slide234Buttons = document.querySelectorAll('[data-hero-button="slide2"], [data-hero-button="slide3"], [data-hero-button="slide4"], .hero-slide-button-1, .hero-slide-button-2, .hero-slide-button-3');
          
          // Apply styles to slide 1 button
          slide1Buttons.forEach(function(btn) {
            if (btn && btn.style) {
              btn.style.setProperty('background-color', 'white', 'important');
              btn.style.setProperty('color', '#FFC107', 'important');
              btn.style.setProperty('display', 'inline-flex', 'important');
              btn.style.setProperty('align-items', 'center', 'important');
              btn.style.setProperty('justify-content', 'center', 'important');
              btn.style.setProperty('cursor', 'pointer', 'important');
              btn.style.setProperty('border-radius', '10px', 'important');
              btn.style.setProperty('font-weight', '700', 'important');
              btn.style.setProperty('position', 'relative', 'important');
              btn.style.setProperty('overflow', 'hidden', 'important');
              btn.style.setProperty('box-shadow', '0 6px 20px rgba(0, 0, 0, 0.15), 0 2px 8px rgba(0, 0, 0, 0.1)', 'important');
              // Set responsive margin-top and padding
              var width = window.innerWidth;
              if (width < 600) {
                btn.style.setProperty('margin-top', '1rem', 'important');
                // Apply mobile-specific padding for mobile Help Today button
                if (btn.hasAttribute('data-hero-button') && btn.getAttribute('data-hero-button') === 'slide1-mobile') {
                  btn.style.setProperty('padding', '0.75rem 1.5rem', 'important');
                  btn.style.setProperty('font-size', '0.8rem', 'important');
                  btn.style.setProperty('margin-bottom', '1.5rem', 'important');
                }
              } else if (width < 960) {
                btn.style.setProperty('margin-top', '1.25rem', 'important');
              } else {
                btn.style.setProperty('margin-top', '1.5rem', 'important');
              }
            }
          });
          
          // Apply styles to slides 2, 3, 4 buttons
          slide234Buttons.forEach(function(btn) {
            if (btn && btn.style) {
              btn.style.setProperty('background-color', '#4FA953', 'important');
              btn.style.setProperty('color', 'white', 'important');
              btn.style.setProperty('display', 'inline-flex', 'important');
              btn.style.setProperty('align-items', 'center', 'important');
              btn.style.setProperty('justify-content', 'center', 'important');
              btn.style.setProperty('cursor', 'pointer', 'important');
              btn.style.setProperty('font-weight', '700', 'important');
              btn.style.setProperty('position', 'relative', 'important');
              btn.style.setProperty('overflow', 'hidden', 'important');
              btn.style.setProperty('box-shadow', '0 10px 30px rgba(79, 169, 83, 0.35), 0 5px 15px rgba(79, 169, 83, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.1)', 'important');
            }
          });
          
          // Apply styles to footer aishx.dev button
          const footerButtons = document.querySelectorAll('[data-footer-button="aishx"]');
          footerButtons.forEach(function(btn) {
            if (btn && btn.style) {
              btn.style.setProperty('background', 'linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.1) 100%)', 'important');
              btn.style.setProperty('backdrop-filter', 'saturate(200%) blur(30px)', 'important');
              btn.style.setProperty('color', '#ffffff', 'important');
              btn.style.setProperty('display', 'flex', 'important');
              btn.style.setProperty('align-items', 'center', 'important');
              btn.style.setProperty('border-style', 'solid', 'important');
              btn.style.setProperty('border-color', 'rgba(255, 255, 255, 0.3)', 'important');
              btn.style.setProperty('box-shadow', '0 1px 6px rgba(0, 0, 0, 0.25)', 'important');
              var width = window.innerWidth;
              if (width < 600) {
                btn.style.setProperty('border-radius', '10px', 'important');
                btn.style.setProperty('border-width', '1px', 'important');
                btn.style.setProperty('padding', '4px 10px', 'important');
                btn.style.setProperty('gap', '6px', 'important');
                btn.style.setProperty('margin-left', '4px', 'important');
              } else if (width < 960) {
                btn.style.setProperty('border-radius', '12px', 'important');
                btn.style.setProperty('border-width', '1.5px', 'important');
                btn.style.setProperty('padding', '5px 12px', 'important');
                btn.style.setProperty('gap', '8px', 'important');
                btn.style.setProperty('margin-left', '6px', 'important');
              } else {
                btn.style.setProperty('border-radius', '14px', 'important');
                btn.style.setProperty('border-width', '1.5px', 'important');
                btn.style.setProperty('padding', '6px 14px', 'important');
                btn.style.setProperty('gap', '8px', 'important');
                btn.style.setProperty('margin-left', '6px', 'important');
              }
            }
          });
          
          // Apply styles to language selector toggle button
          const languageSelectors = document.querySelectorAll('.btn-container, [data-language-selector="true"]');
          languageSelectors.forEach(function(container) {
            if (container && container.style) {
              container.style.setProperty('display', 'flex', 'important');
              container.style.setProperty('align-items', 'center', 'important');
              container.style.setProperty('transition', 'all 0.3s ease', 'important');
              container.style.setProperty('margin-left', '-16px', 'important');
              // Set responsive gap and padding
              var width = window.innerWidth;
              if (width < 600) {
                container.style.setProperty('gap', '0.5rem', 'important');
                container.style.setProperty('padding', '4px 8px', 'important');
              } else if (width < 960) {
                container.style.setProperty('gap', '0.75rem', 'important');
                container.style.setProperty('padding', '4px 10px', 'important');
              } else {
                container.style.setProperty('gap', '1rem', 'important');
                container.style.setProperty('padding', '6px 12px', 'important');
              }
            }
          });
          
          // Apply styles to navbar donate button
          const donateButtons = document.querySelectorAll('[data-navbar-button="donate"]');
          donateButtons.forEach(function(btn) {
            if (btn && btn.style) {
              btn.style.setProperty('background-color', '#4FA953', 'important');
              btn.style.setProperty('color', 'white', 'important');
              btn.style.setProperty('display', 'inline-flex', 'important');
              btn.style.setProperty('align-items', 'center', 'important');
              btn.style.setProperty('justify-content', 'center', 'important');
              btn.style.setProperty('cursor', 'pointer', 'important');
              btn.style.setProperty('font-weight', '700', 'important');
              btn.style.setProperty('position', 'relative', 'important');
              btn.style.setProperty('overflow', 'hidden', 'important');
              btn.style.setProperty('box-shadow', '0 6px 20px rgba(79, 169, 83, 0.35), 0 3px 10px rgba(79, 169, 83, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.1)', 'important');
              // Set responsive padding, font-size, and border-radius
              var width = window.innerWidth;
              if (width < 600) {
                btn.style.setProperty('padding', '6px 14px', 'important');
                btn.style.setProperty('font-size', '0.8rem', 'important');
                btn.style.setProperty('border-radius', '10px', 'important');
              } else if (width < 960) {
                btn.style.setProperty('padding', '8px 20px', 'important');
                btn.style.setProperty('font-size', '0.85rem', 'important');
                btn.style.setProperty('border-radius', '12px', 'important');
              } else {
                btn.style.setProperty('padding', '10px 24px', 'important');
                btn.style.setProperty('font-size', '0.95rem', 'important');
                btn.style.setProperty('border-radius', '14px', 'important');
              }
            }
          });
        }
        
        // Run immediately and multiple times to catch buttons that load at different times
        applyButtonStyles();
        
        // Run again after a short delay to catch buttons that load slightly later
        setTimeout(applyButtonStyles, 0);
        setTimeout(applyButtonStyles, 50);
        setTimeout(applyButtonStyles, 100);
        setTimeout(applyButtonStyles, 200);
        
        // Use requestAnimationFrame to run after DOM is ready
        if (window.requestAnimationFrame) {
          requestAnimationFrame(function() {
            applyButtonStyles();
            requestAnimationFrame(applyButtonStyles);
          });
        }
        
        // Watch for new buttons being added to DOM
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', function() {
            applyButtonStyles();
            setTimeout(applyButtonStyles, 0);
            setTimeout(applyButtonStyles, 100);
          });
        } else {
          // DOM already loaded, run immediately
          setTimeout(applyButtonStyles, 0);
          setTimeout(applyButtonStyles, 100);
        }
        
        // Use MutationObserver to watch for buttons being added
        var observer = new MutationObserver(function(mutations) {
          var shouldApply = false;
          mutations.forEach(function(mutation) {
            mutation.addedNodes.forEach(function(node) {
              if (node.nodeType === 1) {
                if (node.matches && (
                  node.matches('[data-hero-button]') ||
                  node.matches('[data-navbar-button]') ||
                  node.matches('[data-footer-button]') ||
                  node.matches('.hero-slide-1-button') ||
                  node.matches('.hero-slide-button-1') ||
                  node.matches('.hero-slide-button-2') ||
                  node.matches('.hero-slide-button-3') ||
                  node.matches('.btn-container') ||
                  node.matches('[data-language-selector="true"]') ||
                  (node.querySelector && node.querySelector('.btn-container')) ||
                  (node.querySelector && node.querySelector('[data-language-selector="true"]'))
                )) {
                  shouldApply = true;
                }
                // Also check children
                if (node.querySelectorAll) {
                  var buttons = node.querySelectorAll('[data-hero-button], [data-navbar-button], [data-footer-button], .hero-slide-1-button, .hero-slide-button-1, .hero-slide-button-2, .hero-slide-button-3, .btn-container');
                  if (buttons.length > 0) {
                    shouldApply = true;
                  }
                }
              }
            });
          });
          if (shouldApply) {
            setTimeout(applyButtonStyles, 0);
          }
        });
        
        // Start observing
        observer.observe(document.body || document.documentElement, {
          childList: true,
          subtree: true
        });
        
        // Fallback: apply styles periodically for first few seconds
        var attempts = 0;
        var interval = setInterval(function() {
          applyButtonStyles();
          attempts++;
          if (attempts >= 20) { // Stop after 2 seconds (20 * 100ms)
            clearInterval(interval);
          }
        }, 100);
      })();
    </script>
