    <!-- Blocking script to apply styles immediately and watch for Material-UI injection -->
    <script>
      (function () {
        "use strict";
        // Function to force apply styles to toggle button
        function forceApplyToggleStyles() {
          var selectors = [
            ".btn-container",
            '[data-language-selector="true"]',
            "div.btn-container",
            'div[data-language-selector="true"]',
          ];

          selectors.forEach(function (selector) {
            try {
              var elements = document.querySelectorAll(selector);
              elements.forEach(function (el) {
                if (el && el.style) {
                  var width = window.innerWidth || (window.screen && window.screen.width) || 1920;
                  el.style.setProperty("display", "flex", "important");
                  el.style.setProperty("align-items", "center", "important");
                  el.style.setProperty("transition", "all 0.3s ease", "important");
                  el.style.setProperty("margin-left", "-16px", "important");
                  el.style.setProperty("box-sizing", "border-box", "important");

                  if (width < 600) {
                    el.style.setProperty("gap", "0.5rem", "important");
                    el.style.setProperty("padding", "4px 8px", "important");
                  } else if (width < 960) {
                    el.style.setProperty("gap", "0.75rem", "important");
                    el.style.setProperty("padding", "4px 10px", "important");
                  } else {
                    el.style.setProperty("gap", "1rem", "important");
                    el.style.setProperty("padding", "6px 12px", "important");
                  }
                }
              });
            } catch (e) {}
          });
        }

        // Watch for Material-UI style injection in head and immediately re-apply
        if (document.head) {
          var headObserver = new MutationObserver(function () {
            forceApplyToggleStyles();
          });
          headObserver.observe(document.head, {
            childList: true,
            subtree: false,
          });
        }

        // Watch document body for new elements and style changes
        function startBodyObserver() {
          var body = document.body || document.documentElement;
          if (body) {
            var bodyObserver = new MutationObserver(function (mutations) {
              var shouldApply = false;
              mutations.forEach(function (mutation) {
                // Check for added nodes
                mutation.addedNodes.forEach(function (node) {
                  if (node.nodeType === 1) {
                    if (
                      node.matches &&
                      (node.matches(".btn-container") ||
                        node.matches('[data-language-selector="true"]') ||
                        (node.querySelector &&
                          (node.querySelector(".btn-container") ||
                            node.querySelector('[data-language-selector="true"]'))))
                    ) {
                      shouldApply = true;
                    }
                  }
                });
                // Check for attribute changes (style, class) on target
                if (mutation.type === "attributes" && mutation.target) {
                  var target = mutation.target;
                  if (
                    (target.matches &&
                      (target.matches(".btn-container") ||
                        target.matches('[data-language-selector="true"]'))) ||
                    target.classList.contains("btn-container") ||
                    target.hasAttribute("data-language-selector")
                  ) {
                    shouldApply = true;
                  }
                }
              });
              if (shouldApply) {
                forceApplyToggleStyles();
                setTimeout(forceApplyToggleStyles, 0);
                setTimeout(forceApplyToggleStyles, 10);
              }
            });
            bodyObserver.observe(body, {
              childList: true,
              subtree: true,
              attributes: true,
              attributeFilter: ["style", "class"],
            });

            // Also watch each toggle button element individually for style changes
            function watchToggleElements() {
              var elements = document.querySelectorAll(
                '.btn-container, [data-language-selector="true"]'
              );
              elements.forEach(function (el) {
                if (el && !el._toggleWatcher) {
                  el._toggleWatcher = true;
                  var elementObserver = new MutationObserver(function () {
                    forceApplyToggleStyles();
                  });
                  elementObserver.observe(el, {
                    attributes: true,
                    attributeFilter: ["style", "class"],
                    childList: false,
                    subtree: false,
                  });
                }
              });
            }

            // Watch for new elements periodically
            var watchInterval = setInterval(function () {
              watchToggleElements();
            }, 100);

            // Initial watch
            watchToggleElements();

            // Stop watching after 10 seconds (elements should be stable by then)
            setTimeout(function () {
              clearInterval(watchInterval);
            }, 10000);
          } else {
            setTimeout(startBodyObserver, 10);
          }
        }
        startBodyObserver();

        // Apply immediately and with light repeated checks (reduced for performance)
        forceApplyToggleStyles();
        var interval = setInterval(function () {
          forceApplyToggleStyles();
        }, 150);
        setTimeout(function () {
          clearInterval(interval);
        }, 3000);
      })();

    <!-- Early video preloading - starts before React loads for faster first-time load -->
    <script>
      (function () {
        // Vimeo video IDs for hero slides
        var videoIds = {
          mayki: "1147717050",
          nirbhay: "1147718772",
          slide4: "1147716844",
        };

        // Helper to create Vimeo embed URL
        function getVimeoUrl(videoId) {
          return (
            "https://player.vimeo.com/video/" +
            videoId +
            "?autoplay=1&muted=1&loop=1&controls=0&playsinline=1&quality=240p&responsive=1&dnt=1&title=0&byline=0&portrait=0&preload=auto"
          );
        }

        // Start preloading videos as early as possible
        // Only preload slide 2 (mayki) eagerly - slides 3-4 will lazy load
        // This improves LCP by reducing initial load time
        function startVideoPreload() {
          // Only preload on desktop (>= 768px)
          if (window.innerWidth < 768) return;

          // Only preload slide 2 video eagerly (first video slide)
          // Slides 3-4 will be lazy loaded when their previous slide becomes active
          if (!window.__vimeoMaykiPreloaded) {
            try {
              var iframe = document.createElement("iframe");
              iframe.src = getVimeoUrl(videoIds.mayki);
              iframe.style.position = "fixed";
              iframe.style.top = "0";
              iframe.style.left = "0";
              iframe.style.width = "100vw";
              iframe.style.height = "100vh";
              iframe.style.opacity = "0";
              iframe.style.pointerEvents = "none";
              iframe.style.zIndex = "-9999";
              iframe.loading = "eager";
              iframe.setAttribute("fetchpriority", "high");

              // Wait for body to be available
              if (document.body) {
                document.body.appendChild(iframe);
                window.__vimeoMaykiPreloaded = true;
              } else {
                // If body not ready, wait for DOMContentLoaded
                if (document.readyState === "loading") {
                  document.addEventListener("DOMContentLoaded", function () {
                    if (document.body && !window.__vimeoMaykiPreloaded) {
                      document.body.appendChild(iframe);
                      window.__vimeoMaykiPreloaded = true;
                    }
                  });
                } else {
                  // DOM already loaded, try to append
                  setTimeout(function () {
                    if (document.body && !window.__vimeoMaykiPreloaded) {
                      document.body.appendChild(iframe);
                      window.__vimeoMaykiPreloaded = true;
                    }
                  }, 0);
                }
              }
            } catch (e) {
              // Silently fail if there's an error
            }
          }
        }

        // Start preloading immediately if DOM is ready, otherwise wait
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", startVideoPreload);
        } else {
          // DOM already loaded, start immediately
          startVideoPreload();
        }

        // Also try on window load as fallback
        window.addEventListener("load", function () {
          setTimeout(startVideoPreload, 0);
        });
      })();
