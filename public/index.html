    <!-- Web font CSS: kick the fetch off at high priority via preload so
         the woff2 files can stream in parallel with HTML / JS / CSS,
         then activate the stylesheet without blocking render. Combined
         with the metric-adjusted "Lato-fallback" / "RobotoSlab-fallback"
         @font-face declarations above, the font swap is nearly
         invisible and contributes almost zero CLS. -->
    <!-- Primary UI fonts only on first paint; Hindi + display fonts load after idle -->
    <link

    <script>
      (function () {
        var secondary =
          "https://fonts.googleapis.com/css2?family=Hind:wght@400;600;700&family=Mukta:wght@400;600;700&family=Pacifico&display=swap";
        var loadSecondary = function () {
          if (document.getElementById("aadar-secondary-fonts")) return;
          var link = document.createElement("link");
          link.id = "aadar-secondary-fonts";
          link.rel = "stylesheet";
          link.href = secondary;
          document.head.appendChild(link);
        };
        try {
          var lng = localStorage.getItem("i18nextLng") || "";
          if (lng.indexOf("hi") === 0) {
            loadSecondary();
            return;
          }
        } catch (e) {}
        if ("requestIdleCallback" in window) {
          requestIdleCallback(loadSecondary, { timeout: 3500 });
        } else {
          window.addEventListener("load", function () {
            setTimeout(loadSecondary, 1200);
          });
        }
      })();
    </script>

    <!-- Critical CSS for CTA buttons - must load before React to prevent FOUC -->
    <style>
      /*
       * Metric-adjusted fallback fonts.
       *
       * The Lato + Roboto Slab webfonts ship via Google Fonts using
       * `display=swap`, which means the browser paints text in a
       * system fallback first and swaps to the webfont once it loads.
       * If the fallback has different metrics than the webfont, the
       * swap reflows every paragraph / heading — the dominant source
       * of Cumulative Layout Shift on this site.
       *
       * These @font-face rules define system-font copies (Arial /
       * Times) with `size-adjust`, `ascent-override`, `descent-override`,
       * and `line-gap-override` chosen so the fallback text has nearly
       * identical line height and glyph widths to the real webfont.
       * The webfont still wins once loaded; the swap is just invisible.
       */
      @font-face {
        font-family: "Lato-fallback";
        font-style: normal;
        font-weight: 400;
        src: local("Arial");
        size-adjust: 97.38%;
        ascent-override: 99%;
        descent-override: 21.5%;
        line-gap-override: 0%;
      }
      @font-face {
        font-family: "Lato-fallback";
        font-style: normal;
        font-weight: 700;
        src: local("Arial Bold"), local("Arial");
        size-adjust: 97.38%;
        ascent-override: 99%;
        descent-override: 21.5%;
        line-gap-override: 0%;
      }
      @font-face {
        font-family: "Lato-fallback";
        font-style: normal;
        font-weight: 900;
        src: local("Arial Black"), local("Arial");
        size-adjust: 97.38%;
        ascent-override: 99%;
        descent-override: 21.5%;
        line-gap-override: 0%;
      }
      @font-face {
        font-family: "RobotoSlab-fallback";
        font-style: normal;
        font-weight: 700;
        src: local("Times New Roman Bold"), local("Times New Roman");
        size-adjust: 100.06%;
        ascent-override: 92.6%;
        descent-override: 24.4%;
        line-gap-override: 0%;
      }
      @font-face {
        font-family: "Pacifico-fallback";
        font-style: normal;
        font-weight: 400;
        src: local("Segoe Script"), local("Brush Script MT"), local("cursive");
        size-adjust: 108%;
        ascent-override: 102%;
        descent-override: 32%;
        line-gap-override: 0%;
      }

        overflow: hidden !important;

      .btn-container,
